<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XHUB</title>
<meta name="monetag" content="a422048a74688cf3052bab8ab54443e9">

<link rel="preconnect" href="https://tv1.indoav.app">
<link rel="dns-prefetch" href="https://tv1.indoav.app">
<link rel="preconnect" href="https://abacus.jasoncameron.dev">

<style>
:root{--bg:#0e1115;--card:#161a20;--text:#e8eaed;--mute:#8b94a0;--line:#232932;--accent:#6ee7c8;--glass:rgba(14,17,21,.72)}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f8;--card:#fff;--text:#1d232b;--mute:#6b7683;--line:#e3e7ec;--accent:#0f9d83;--glass:rgba(244,246,248,.78)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1160px;margin:0 auto;padding:14px 18px}
.logo{font-size:24px;font-weight:800;letter-spacing:3px;color:var(--text);text-decoration:none;cursor:pointer;user-select:none}
.logo span{color:var(--accent)}
.stats{display:flex;gap:8px}
.stats span{display:flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px;background:var(--card)}
.stats span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stats b{color:var(--text);font-weight:600}
main{max-width:1160px;margin:0 auto;padding:24px 18px 36px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s,box-shadow .2s;scroll-margin-top:90px}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.18)}
.card.hl{outline:2px solid var(--accent)}
.player{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 30% 20%,#2b3745,#151a21)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.meta{display:flex;gap:14px;color:var(--mute);font-size:12.5px;padding:10px 14px}
nav{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 16px 48px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;min-width:40px;padding:7px 12px;cursor:pointer;transition:.15s}
nav button:hover:not(:disabled){border-color:var(--accent)}
nav button.on{background:var(--accent);border-color:var(--accent);color:#0e1115;font-weight:700}
nav button:disabled{opacity:.35;cursor:default}
@media (max-width:600px){.wrap{padding:12px}.logo{font-size:21px}.stats span{padding:4px 9px;font-size:12px}main{padding:16px 12px 30px;gap:16px}}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="logo" id="home"><span>X</span>HUB</a>
  <div class="stats"><span>Visits <b id="sv">0</b></span><span>Plays <b id="sp">0</b></span></div>
</div></header>

<main id="grid"></main>
<nav id="pager"></nav>

<script>
/* ========= الإعدادات ========= */
const PER_PAGE = 12; // عدد الفيديوهات في الصفحة

// اسم خاص بموقعك للعدادات (متغيروش وإلا الأرقام هتبدأ من الصفر)
const NAMESPACE = "videohub-k7q2x9";
const COUNTER_API = "https://abacus.jasoncameron.dev";

const KEY_SITE = "site";               // إجمالي الزيارات
const KEY_TOTAL_PLAYS = "total_plays"; // إجمالي مرات التشغيل

// رابط الإعلان: بيتفتح مرة واحدة لكل جلسة عند أول ضغطة
const AD_LINK = "https://uplcm.com/4/11848806";

// أضف أي فيديو جديد هنا: حط الـ ID بس (الجزء اللي بعد /e/)
const videoIds = [
  "3r5kwCzBaQjm", "ihlzJXMOQzSV",
  "twqDmMjK0K1W", "QbGOK0xUlbLe", "06plUq43Ta7j", "bw7789dyRuqQ",
  "BDGC67f9Brt9", "diQ7FaFeKGfJ", "ND9dWssurM74",
  "BFx6MFJazkX5", "pdQPpKIXzClX", "M63O5nDB3ebR", "mJUEEbcBRTIw", "HHxlvVwxS1x3",

  "FHHvWFVgQWEG", "qCDEq4q1PuNx", "3gtGkOMnPmwO", "NnhCvnt3habU", "y8Cz7wgUS7CQ",

  "kqJGfVDo8gxo", "uNsER7hAQp2c", "PzA2bpaiBE0X", "14JnFENWO2mY", "GQ52o4jER3Mb",
  "ZRtBgzo386ot", "WI3LkZ3JzMEX", "cB4Lh1zOGv1C", "SRjGiw6GBx08", "fwMg7Q47X1qH",
  "OLr07LLWDlyC", "JG05hqc59AnR", "XRYy1EnMyb1r", "DGeTXhpHFQLn", "qiQN5bAyQ8LO",
  "hKe8myy8oN9o", "Pty9OeO1uBu7", "E88S69k50yAV", "xP7EnHewKtOP", "KjXMPptfAYtN",
  "piwp2RvnOxS4", "d3UxuyBb6Pu3", "RkZz5ITztRfu", "jOuCy1xMBNTu", "SI21LA7dsNYF",
  "g7dL8jCEI8zi", "QImCrWSbRI1H", "H21Nw9po5sbr", "OXFxyEwuviK4", "akXhOA6DbKxT",
  "rOhkNr04AE0q", "ZgaqiiyLP3TR", "8QpABRotycJ6", "TZBTBg8Y4FzB", "3RNwVs9Iw7dd",
  "bJQhMdRO9HT2", "gSmhTZ1ZAAtA", "s1gbYQwxxVvk", "WiL4OU9qVGGV", "Z9Kcpa8kwk26",
  "e0LB704TeLcQ", "Kd5IMoTdcPfl", "5bxWyUj2sYyO", "ujoCoO8zaI7h", "jhRLgwCZhi1b",
  "Hi6wk0ZxAAnX", "uwFwcc31N7mM", "cIxkb65Zv8e4", "CHeWDVRVCrlz", "NtB26toKzhch",

  "AOO9SLd5XGlA", "s60soJyRqdNY", "nwETBEsy0CN2", "zCYYtpOC5rZF", "M05UrMAI7cln",
  "ZlX2ErsVIqTf", "N083LZxnV25q", "UJwXNjaw20NH", "0T0osBNJxPMX", "t2tN2PIGCuyw",
  "lO8A8Jkayegg", "8t4qd3gTb4a1", "mhRc0iYtQgj0", "fxA3u7Y4xwMP", "en2MrD0OH8la",
  "9m1kFyUI2oLF", "nngQDEK5oAFc", "1V9ux0ACKfs1", "U8yEa5DG6SS2", "z0Gjpj7jNvtn",
  "T2HUuSdMGKv1", "EYopsd7RuyKP", "o6VETLxd8ssr", "E40CZhLiI4cX", "sKnprmFo4Mf0",
  "zgdynysfmIOL", "cAPVfzGNbkRA", "Us88JXlP4Rfx", "cw9gobfLnzep", "tCDcZUOpRvlt"
];

/* ========= العدادات ========= */
const stats = {};
const fmt = n => Number(n || 0).toLocaleString("en-US");
const $ = id => document.getElementById(id);

async function counterRequest(action, key) {
  try {
    const res = await fetch(COUNTER_API + "/" + action + "/" + NAMESPACE + "/" + key);
    if (!res.ok) return 0;
    const data = await res.json();
    return Number(data.value) || 0;
  } catch (e) { return null; }
}

function paint() {
  document.querySelectorAll("[data-views]").forEach(el => {
    const v = stats[el.dataset.views];
    el.textContent = "👁 " + (v !== undefined ? fmt(v) : "…") + " views";
  });
  if (stats[KEY_SITE] !== undefined) $("sv").textContent = fmt(stats[KEY_SITE]);
  if (stats[KEY_TOTAL_PLAYS] !== undefined) $("sp").textContent = fmt(stats[KEY_TOTAL_PLAYS]);
}

// تحميل أرقام الكارت لما يقرب من الشاشة فقط (توفير في الطلبات)
async function loadCardStats(id) {
  if (stats[id] !== undefined) return;
  const v = await counterRequest("get", id);
  if (v !== null) { stats[id] = v; paint(); }
}

// زيارة الموقع: مرة واحدة لكل جلسة
async function trackVisit() {
  let first = false;
  try {
    first = !sessionStorage.getItem("visited");
    if (first) sessionStorage.setItem("visited", "1");
  } catch (e) {}
  const r = await Promise.all([
    counterRequest(first ? "hit" : "get", KEY_SITE),
    counterRequest("get", KEY_TOTAL_PLAYS)
  ]);
  if (r[0] !== null) stats[KEY_SITE] = r[0];
  if (r[1] !== null) stats[KEY_TOTAL_PLAYS] = r[1];
  paint();
}

// مشاهدة الفيديو: مرة واحدة لكل فيديو في الجلسة
async function trackPlay(id) {
  const key = "played_" + id;
  try {
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, "1");
  } catch (e) {}
  const r = await Promise.all([counterRequest("hit", id), counterRequest("hit", KEY_TOTAL_PLAYS)]);
  if (r[0] !== null) stats[id] = r[0];
  if (r[1] !== null) stats[KEY_TOTAL_PLAYS] = r[1];
  paint();
}

/* اكتشاف التشغيل: الضغط جوه الـ iframe = تشغيل */
let lastFocusedId = null;
function checkIframeFocus() {
  const el = document.activeElement;
  if (el && el.tagName === "IFRAME" && el.dataset.id) {
    if (el.dataset.id !== lastFocusedId) { lastFocusedId = el.dataset.id; trackPlay(el.dataset.id); }
  } else lastFocusedId = null;
}
addEventListener("blur", () => setTimeout(checkIframeFocus, 0));
setInterval(checkIframeFocus, 400);

/* ========= رابط الإعلان ========= */
// بيتفتح مرة واحدة فقط لكل جلسة، عند أول ضغطة على الصفحة
let adOpened = false;
try { adOpened = !!sessionStorage.getItem("ad_opened"); } catch (e) {}
document.addEventListener("click", function () {
  if (adOpened) return;
  adOpened = true;
  try { sessionStorage.setItem("ad_opened", "1"); } catch (e) {}
  window.open(AD_LINK, "_blank", "noopener");
});

/* ========= العرض ========= */
const totalPages = Math.ceil(videoIds.length / PER_PAGE);
const grid = $("grid"), pager = $("pager");

// تحميل الفيديو لما يقرب من الشاشة، فتظهر صورته بدون ضغط
const playerIO = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.src = e.target.dataset.src; playerIO.unobserve(e.target); }
}), { rootMargin: "300px" });

const cardIO = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { loadCardStats(e.target.dataset.card); cardIO.unobserve(e.target); }
}), { rootMargin: "200px" });

function getVideoFromUrl() {
  const v = new URLSearchParams(location.search).get("v");
  return v && videoIds.indexOf(v) !== -1 ? v : null;
}

function getPageFromUrl() {
  const v = getVideoFromUrl();
  if (v) return Math.floor(videoIds.indexOf(v) / PER_PAGE) + 1;
  const p = parseInt(new URLSearchParams(location.search).get("page"), 10);
  return p >= 1 && p <= totalPages ? p : 1;
}

function card(id) {
  const el = document.createElement("div");
  el.className = "card";
  el.id = "v-" + id;
  el.dataset.card = id;

  el.innerHTML =
    '<div class="player"><iframe data-id="' + id + '" data-src="https://tv1.indoav.app/e/' + id + '" ' +
    'allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>' +
    '<div class="meta"><span data-views="' + id + '">👁 … views</span></div>';

  playerIO.observe(el.querySelector("iframe"));
  cardIO.observe(el);
  return el;
}

function renderPagination(page) {
  pager.innerHTML = "";
  const mk = (t, p, dis, on) => {
    const b = document.createElement("button");
    b.textContent = t; b.disabled = !!dis;
    if (on) b.className = "on";
    b.onclick = () => goToPage(p);
    pager.append(b);
  };
  mk("‹", page - 1, page === 1);
  for (let i = 1; i <= totalPages; i++) mk(i, i, false, i === page);
  mk("›", page + 1, page === totalPages);
}

function showPage(page) {
  grid.innerHTML = "";
  lastFocusedId = null;
  videoIds.slice((page - 1) * PER_PAGE, page * PER_PAGE).forEach(id => grid.append(card(id)));
  renderPagination(page);
  paint();
}

function goToPage(page) {
  try { history.pushState({}, "", "?page=" + page); } catch (e) {}
  showPage(page);
  scrollTo({ top: 0, behavior: "smooth" });
}

$("home").onclick = () => {
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  showPage(1);
  scrollTo({ top: 0, behavior: "smooth" });
};

addEventListener("popstate", () => showPage(getPageFromUrl()));

/* ========= التشغيل ========= */
showPage(getPageFromUrl());
trackVisit();

(function () {
  const v = getVideoFromUrl();
  if (!v) return;
  setTimeout(() => {
    const c = $("v-" + v);
    if (c) { c.classList.add("hl"); c.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }, 300);
})();
</script>
</body>
</html>
